    <meta charset="utf-8" />

    <title>OdontoCloud</title>
    <link rel="icon" type="image/png" href="/odontocloud-react/assets/logo.png" />
    <link rel="manifest" href="/odontocloud-react/manifest.json" />
    <!-- SPA redirect fix for GitHub Pages - evita 404 al recargar -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
