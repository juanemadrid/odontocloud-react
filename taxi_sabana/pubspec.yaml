name: taxi_sabana
description: "Aplicación Taxi Sabana (base Flutter + Firebase lista para desarrollo)"
publish_to: "none"

version: 1.47.2+59

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Íconos y UI ---
  cupertino_icons: ^1.0.8

  # --- Firebase (estable y compatible con Flutter 3.10) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.2.10
  firebase_database: ^11.0.0

  # --- Multimedia / cámara y galería ---
  image_picker: ^1.1.2

  # --- Utilidades ---
  url_launcher: ^6.3.0
  path_provider: ^2.1.2             # ✅ Para cachear audio
  shared_preferences: ^2.2.3        # ✅ Guardar último correo
  local_auth: ^2.2.0                # ✅ Huella / FaceID
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  flutter_secure_storage: ^9.2.2    # ✅ Guardar credenciales para login con huella

  # ✅ Notificación local con sonido
  flutter_local_notifications: ^17.2.2

  # --- MAPAS / GEO ---
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.2
  flutter_polyline_points: ^3.1.0

  # --- Animaciones Lottie ---
  lottie: ^3.1.2

  # --- Audio / alertas ---
  audioplayers: ^6.1.0

  # --- Carga y efectos visuales ---
  flutter_spinkit: ^5.2.1

  # ✅ NUEVO (OBLIGATORIO PARA WOMPI)
  webview_flutter: ^4.8.0
  share_plus: ^10.0.0

  # --- BARRIOS / IMPORTACIÓN ---
  csv: ^6.0.0
  file_picker: ^8.0.0
  maps_toolkit: ^3.0.0
  flutter_tts: ^4.2.3
  wakelock_plus: ^1.4.0
  flutter_background_service: ^5.0.0
  in_app_update: ^4.2.5
  package_info_plus: ^9.0.0
  timezone: ^0.9.4
  device_info_plus: ^12.3.0
  flutter_overlay_window: ^0.5.0
  android_intent_plus: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Generador del ícono ---
  flutter_launcher_icons: ^0.14.1

  # --- Splash ---
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # --- Rutas de imágenes y recursos ---
  assets:
    - assets/imagenes/
    - assets/iconos/
    - assets/animaciones/
    - assets/sonidos/
    - assets/sincelejo_barrios.json

# --- Configuración del ícono de la app ---
flutter_icons:
  android: true
  ios: true
  image_path: "assets/iconos/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/iconos/logo.png" 
  adaptive_icon_foreground: "assets/iconos/empty.png" # ✅ Fix: Truly transparent foreground
